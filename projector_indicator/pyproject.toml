[project]
name = "projector-indicator"
version = "0.1.0"
description = "Turn signal, car path, persons and ads projected undistorted onto the ground in front of the car"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14",
    "numpy>=1.26",          # camera calibration only
    "opencv-python>=4.9",   # camera calibration only
]

[project.scripts]
projector-indicator = "projector_indicator.indicator:main"
projector-cal = "projector_indicator.projector_cal:main"
fake-car = "projector_indicator.fake_car:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["projector_indicator"]

[tool.pytest.ini_options]
testpaths = ["test"]
